<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="profile-container">

        <div class="profile-card">

            <h1>My Profile</h1>

            <h2>Member</h2>

            <p class="email"></p>

            <p>
                Member since Recently
            </p>

            <div class="stats">

                <div class="stat-box">

                    <h2>0</h2>

                    <p>Available Tokens</p>

                </div>

            </div>

            <h3>Next Event</h3>

            <div class="event-item">

                <p>
                    ✨ No upcoming events yet.
                </p>

                <button id="browseEventsBtn">
                    Browse Events
                </button>

            </div>

            <button id="coursesBtn" class="back-btn">

                My Courses

            </button>

            <button id="homeBtn" class="back-btn">

                Back Home

            </button>

        </div>

    </div>

</body>
</html>
